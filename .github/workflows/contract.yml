name: Persistence Contract

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  host-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EDP-Persistence
        uses: actions/checkout@v4

      - name: Compile positive contract tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Itests/support -Isrc \
            tests/PersistenceContractTests.cpp \
            -o persistence-contract-tests

      - name: Run positive contract tests
        run: ./persistence-contract-tests

      - name: Compile provider example
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -Itests/support -Isrc \
            -c examples/ProviderContractExample.cpp \
            -o provider-example.o

      - name: Verify compile-fail contracts
        shell: bash
        run: |
          set -euo pipefail
          for source in tests/compile_fail/*.cpp; do
            echo "Expecting compilation failure: ${source}"
            if g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
              -Itests/support -Isrc \
              -c "${source}" -o /tmp/compile-fail.o; then
              echo "ERROR: ${source} unexpectedly compiled successfully"
              exit 1
            fi
          done
